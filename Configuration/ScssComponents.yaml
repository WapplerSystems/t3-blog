# Mapping of component keys to SCSS files for the t3bootstrap blog extension.
# Auto-discovered by WapplerSystems\WsComponents when any of this package's
# Site Sets is active on the current site.

components:
  blog:
    files:
      - 'EXT:ws_blog/Resources/Public/SCSS/blog.scss'
    # Pagination is a separate key (template or own registration) and is
    # required next to "blog" in the templates, so blog.scss stays
    # self-contained and compiles without EXT:template.
