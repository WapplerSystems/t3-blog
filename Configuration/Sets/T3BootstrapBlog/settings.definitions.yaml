categories:
  t3bootstrap-blog:
    label: 'T3Bootstrap Blog'
  t3bootstrap-blog.list:
    label: 'Blog-Liste'
    parent: t3bootstrap-blog

settings:
  t3bootstrap-blog.listDesign:
    type: string
    default: 'default'
    label: 'Blog-Listen-Design'
    description: 'Layout für die Blog-Übersichtsseite. "default" = klassisches Layout, "card" = Karten-Design.'
    enum:
      default: 'Standard'
      card: 'Karten-Design'
    category: t3bootstrap-blog.list
  t3bootstrap-blog.placeholderImage:
    type: string
    default: 'EXT:ws_blog/Resources/Public/Images/placeholder.svg'
    label: 'Platzhalterbild'
    description: 'Erscheint in den Blog-Listen, wenn ein Beitrag kein Beitragsbild hat. Pfad (EXT:…, fileadmin/…) oder FAL-Kennung (1:/…), am besten im Format 3:2. Leer lassen, um keinen Platzhalter anzuzeigen.'
    category: t3bootstrap-blog.list
