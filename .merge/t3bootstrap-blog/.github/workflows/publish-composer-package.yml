name: Publish Composer Package

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: vars.COMPOSER_UPLOAD_URI != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Zip source code with tag
        id: make_zip
        run: |
          PACKAGE_NAME=$(basename "$GITHUB_REPOSITORY")
          ZIP_NAME="${{ steps.get_tag.outputs.tag }}.zip"
          git archive --format=zip --output="$ZIP_NAME" "${{ steps.get_tag.outputs.tag }}"
          echo "Created $ZIP_NAME"
          echo "zipname=$ZIP_NAME" >> "$GITHUB_OUTPUT"
      - name: Check contents of ZIP file
        run: |
          unzip -l ${{ steps.make_zip.outputs.zipname }}
      - name: Upload to composer registry
        run: |
          echo "Uploading file to ${{ vars.COMPOSER_UPLOAD_URI }}"
          RESPONSE=$(curl -s -w "%{http_code}" -o response.txt -H "Authorization: token $TOKEN" --upload-file ${{ steps.make_zip.outputs.zipname }} ${{ vars.COMPOSER_UPLOAD_URI }}?version=${{ steps.get_tag.outputs.tag }})
          echo "HTTP Status: $RESPONSE"
          echo "--- Response body ---"
          cat response.txt

          if [ "$RESPONSE" -ge 400 ]; then
            echo "Upload failed!"
            exit 1
          fi
env:
  TOKEN: ${{ secrets.COMPOSER_UPLOAD_TOKEN }}
