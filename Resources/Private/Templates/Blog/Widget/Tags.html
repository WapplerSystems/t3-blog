<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:f="http://typo3.org/ns/fluid/ViewHelpers"
      xmlns:blogvh="http://typo3.org/ns/T3G/AgencyPack/Blog/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Widget" />
<f:section name="Title"><f:translate extensionName="WsBlog" key="headline.tags" /></f:section>
<f:section name="Content">
    <ul class="blog__sidebar__tags list-unstyled">
        <f:for each="{tags}" as="tag">
            <li class="{f:if(condition: '{currentTag} == {tag.uid}', then: ' blogwidgetlist__item--active')}" data-blog-tag="{tag.uid}">
                <blogvh:link.tag class="" tag="{tag.tagObject}" />
            </li>
        </f:for>
    </ul>
</f:section>
</html>
