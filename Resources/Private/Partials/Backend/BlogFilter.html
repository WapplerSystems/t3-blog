<f:form class="form-inline" action="{action}">
    <div class="form-group">
        <label for="blogSetup"><f:translate extensionName="WsBlog" key="label.blog" /></label>
        <f:form.select
            class="form-control"
            name="blogSetup"
            id="blogSetup"
            value="{activeBlogSetup}"
            options="{blogSetups}"
            optionLabelField="path"
            optionValueField="uid"
            prependOptionLabel="{f:translate(key: 'label.all', extensionName: 'WsBlog')}"
            prependOptionValue="" />
    </div>
    <button type="submit" class="btn btn-default"><f:translate extensionName="WsBlog" key="label.choose_blog" /></button>
</f:form>
